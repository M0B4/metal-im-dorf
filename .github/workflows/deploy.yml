name: Website veröffentlichen

# Die Website läuft auf Cloudflare (metal-im-dorf.de). Bei jedem Push auf master baut Cloudflare
# selbst (Workers Builds). Dieser Workflow baut zusätzlich neu, wenn sich nur Inhalte in Sanity
# geändert haben: per Klick (Actions → Run workflow), per Sanity-Webhook oder einmal täglich,
# damit vergangene Veranstaltungen in den Rückblick rutschen.

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content-update]
  schedule:
    - cron: '0 3 * * *'

jobs:
  cloudflare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare
      cancel-in-progress: true
    env:
      WORKERS_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Alte Adresse m0b4.github.io/metal-im-dorf leitet auf metal-im-dorf.de um.
  github-pages-redirect:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/redirect
      - id: deployment
        uses: actions/deploy-pages@v4
