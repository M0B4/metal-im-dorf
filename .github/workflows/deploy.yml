name: Website veröffentlichen

# Die Website läuft auf Cloudflare (metal-im-dorf.de). Bei jedem Push auf master baut Cloudflare
# selbst (Workers Builds). Dieser Workflow baut zusätzlich neu, damit Änderungen in Sanity online
# gehen: nach jedem Veröffentlichen in Sanity (Webhook), jeden Tag um 12 Uhr deutscher Zeit und
# per Klick (Actions → Website veröffentlichen → Run workflow).

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Sanity-Webhook (siehe README): baut nach jedem Veröffentlichen neu.
  repository_dispatch:
    types: [sanity-content-update]
  # Cron läuft in UTC: 10 Uhr UTC = 12 Uhr Sommerzeit, 11 Uhr UTC = 12 Uhr Winterzeit.
  # Der erste Schritt lässt nur den Lauf durch, bei dem es in Deutschland 12 Uhr ist.
  schedule:
    - cron: '0 10,11 * * *'

jobs:
  cloudflare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare
      cancel-in-progress: true
    env:
      WORKERS_CI: '1'
    steps:
      - id: zeit
        run: |
          stunde=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$stunde" = "12" ]; then
            echo "bauen=ja" >> "$GITHUB_OUTPUT"
          else
            echo "In Deutschland ist es $stunde Uhr, der Lauf zur anderen UTC-Stunde baut."
          fi
      - if: steps.zeit.outputs.bauen == 'ja'
        uses: actions/checkout@v4
      - if: steps.zeit.outputs.bauen == 'ja'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.zeit.outputs.bauen == 'ja'
        run: npm ci
      - if: steps.zeit.outputs.bauen == 'ja'
        run: npm run build
      - if: steps.zeit.outputs.bauen == 'ja'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Alte Adresse m0b4.github.io/metal-im-dorf leitet auf metal-im-dorf.de um.
  github-pages-redirect:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/redirect
      - id: deployment
        uses: actions/deploy-pages@v4
