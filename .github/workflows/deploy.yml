name: Website veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Sanity-Webhook (optional, siehe README): baut sofort nach dem Veröffentlichen.
  repository_dispatch:
    types: [sanity-content-update]
  # Ohne Webhook erscheinen veröffentlichte Inhalte spätestens nach zehn Minuten.
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=frontend
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
